name: Build, test e release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Font offline (Instrument Sans, JetBrains Mono)
        run: |
          mkdir -p /tmp/fonts && cd /tmp/fonts
          npm pack @fontsource/instrument-sans@5 @fontsource/jetbrains-mono@5
          for f in *.tgz; do mkdir -p "${f%.tgz}" && tar xzf "$f" -C "${f%.tgz}"; done
          DEST="$GITHUB_WORKSPACE/app/src/main/assets/www/fonts"
          mkdir -p "$DEST"
          cp */package/files/instrument-sans-latin-{400,500,600,700}-normal.woff2 "$DEST"/
          cp */package/files/jetbrains-mono-latin-{400,500}-normal.woff2 "$DEST"/
          ls -la "$DEST"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rinomina APK
        run: |
          VER="0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "CasaMia-$VER.apk"
          echo "VER=$VER" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: CasaMia-*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Casa Mia 0.1.${{ github.run_number }}
          make_latest: true
          body: |
            Da telefono: scarica il file .apk qui sotto e aprilo per installarlo.
            Commit: ${{ github.sha }}
          files: |
            CasaMia-*.apk
