plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'it.casamia.app'
    compileSdk 34

    defaultConfig {
        applicationId 'it.casamia.app'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "0.1.${buildNumber}"
    }

    signingConfigs {
        casamia {
            // Chiave fissa: permette di installare gli aggiornamenti sopra la versione precedente
            // senza disinstallare l'app (e senza perdere i progetti salvati).
            storeFile file('casamia.keystore')
            storePassword 'casamia-store'
            keyAlias 'casamia'
            keyPassword 'casamia-store'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.casamia
        }
        debug {
            signingConfig signingConfigs.casamia
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // Includi anche file che iniziano con "_" o "." nelle assets dell'app web
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
