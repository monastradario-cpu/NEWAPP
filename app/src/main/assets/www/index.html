<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1">
<title>Casa Mia</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="home" class="screen" aria-label="I tuoi progetti">
    <header class="home-head">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg>
        <span>Casa Mia</span>
      </div>
      <div class="head-actions">
      <button class="update-btn" id="updateBtn" aria-label="Aggiorna l'app">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        <span>Aggiorna</span><i class="badge hidden" id="updateBadge"></i>
      </button>
      <button class="icon-btn" id="homeMenu" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg>
      </button>
      </div>
    </header>
    <div class="home-body">
      <h1>I tuoi progetti</h1>
      <div class="quick">
        <button class="quick-btn primary" id="newProject">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nuovo
        </button>
        <button class="quick-btn" id="loadPlan">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Planimetria
        </button>
        <button class="quick-btn" id="openSample">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 12h8v8M12 4v4"/></svg>Esempio
        </button>
      </div>
      <div class="section-label">Recenti</div>
      <div id="projectList" class="project-list"></div>
    </div>
  </section>

  <!-- EDITOR -->
  <section id="editor" class="screen hidden" aria-label="Pianta">
    <header class="topbar">
      <button class="icon-btn ghost" id="backHome" aria-label="Torna ai progetti">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="title-btn" id="projectTitle" aria-label="Rinomina progetto">
        <span class="t-name" id="projectName"></span>
        <span class="t-sub" id="projectSub"></span>
      </button>
      <button class="icon-btn ghost" id="undoBtn" aria-label="Annulla" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
      </button>
      <button class="icon-btn ghost" id="redoBtn" aria-label="Ripeti" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
      </button>
      <button class="icon-btn ghost" id="moreBtn" aria-label="Altre opzioni">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg>
      </button>
    </header>

    <div class="tools-wrap">
      <div class="tools" id="tools" role="toolbar" aria-label="Strumenti"></div>
      <div class="subtools hidden" id="subtools" role="toolbar" aria-label="Tipo di apertura"></div>
    </div>

    <div class="stage" id="stage">
      <canvas id="planCanvas" aria-label="Pianta della casa"></canvas>
      <button class="compass" id="compass" aria-label="Orientamento: imposta il nord">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><g id="compassNeedle"><path d="M20 5l5 15h-10z" fill="#D23B2A"/><path d="M20 35l-5-15h10z" fill="#C9C6BE"/></g></svg>
        <span class="compass-n" id="compassN">N</span>
      </button>
      <div class="zoomctl">
        <button class="icon-btn" id="zoomIn" aria-label="Ingrandisci"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-btn" id="zoomOut" aria-label="Riduci"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button class="icon-btn" id="zoomFit" aria-label="Adatta alla vista"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="scalebar" id="scalebar"><span class="bar"></span><span class="lbl">1 m</span></div>
      <div class="hint" id="hint" role="status"><span id="hintText"></span><span class="hint-actions" id="hintActions"></span></div>
      <aside class="sheet hidden" id="sheet" aria-label="Proprietà"></aside>
    </div>

    <div class="tabview hidden" id="tabview"></div>
    <div class="view3d-wrap hidden" id="view3dWrap">
      <div id="view3d" class="view3d"></div>
      <div class="v3d-bar" id="v3dBar"></div>
      <div class="sun-panel hidden" id="sunPanel"></div>
      <div class="joystick hidden" id="joystick" aria-label="Muoviti nella casa" role="application"><i></i></div>
    </div>

    <div class="summary" id="summary"></div>

    <nav class="tabbar" aria-label="Sezioni del progetto">
      <button class="tab active" data-tab="pianta" aria-current="page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 12h9v9M12 3v5"/></svg><span>Pianta</span>
      </button>
      <button class="tab" data-tab="3d">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg><span>3D</span>
      </button>
      <button class="tab" data-tab="arredo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v5H3z"/><path d="M5 18v2M19 18v2"/></svg><span>Arredo</span>
      </button>
      <button class="tab" data-tab="costi">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5a4 4 0 1 0 0 7M7 11h6M7 13.5h6"/></svg><span>Costi</span>
      </button>
      <button class="tab" data-tab="lavori">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="M8.5 13l2.5 2.5 4.5-5"/></svg><span>Lavori</span>
      </button>
    </nav>
  </section>

  <div class="overlay hidden" id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="lib/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/catalog.js"></script>
<script src="js/sample.js"></script>
<script src="js/render.js"></script>
<script src="js/render2.js"></script>
<script src="js/editor.js"></script>
<script src="js/store.js"></script>
<script src="js/costs.js"></script>
<script src="js/ai.js"></script>
<script src="js/planimetria.js"></script>
<script src="js/view3d.js"></script>
<script src="js/ui.js"></script>
<script src="js/sheets.js"></script>
<script src="js/tabs.js"></script>
<script src="js/shop.js"></script>
<script src="js/share.js"></script>
<script src="js/main.js"></script>
</body>
</html>
